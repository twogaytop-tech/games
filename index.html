<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Games — Play Now</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#0f0518 0%,#1a0a30 50%,#0d0d1a 100%);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#f0e6ff;overflow:hidden;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 80%,rgba(138,43,226,.15)0%,transparent 70%),radial-gradient(ellipse 60% 50% at 80% 20%,rgba(233,30,99,.12)0%,transparent 70%);pointer-events:none}
.stars{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) ease-in-out infinite;opacity:.4}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.8;transform:scale(1.5)}}
.card{position:relative;z-index:1;text-align:center;max-width:520px;padding:48px 40px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;backdrop-filter:blur(20px);box-shadow:0 24px 80px rgba(138,43,226,.15)}
.badge{display:inline-block;padding:5px 16px;background:rgba(138,43,226,.25);border:1px solid rgba(138,43,226,.4);border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#c084fc;margin-bottom:20px}
h1{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#e879f9,#f472b6,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
p{font-size:16px;line-height:1.7;color:#a78bfa}
.loading{color:rgba(167,139,250,.4);font-size:14px;margin-top:24px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="card">
 <div class="badge">&#11088; Trending AI Experience</div>
 <h1>AI-Powered Games<br>That Feel Real</h1>
 <p>Chat, play, and connect with ultra-realistic AI characters — designed for adults who want something beyond ordinary.</p>
 <p class="loading">Redirecting...</p>
</div>
<script>
var s=document.getElementById('stars');
for(var i=0;i<60;i++){
 var d=document.createElement('div');
 d.className='star';
 d.style.left=Math.random()*100+'%';
 d.style.top=Math.random()*100+'%';
 d.style.setProperty('--d',(2+Math.random()*4)+'s');
 d.style.animationDelay=Math.random()*4+'s';
 s.appendChild(d);
}
setTimeout(function(){
 window.location.href='https://safeoffers.pro/a/Wyv9u8xNhx97V';
},1000);
</script>
</body>
</html>
