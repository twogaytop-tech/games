<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adult Games & AI - Experience Now</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    
    /* Starfield background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 160px 30px, #fff, transparent);
      background-repeat: repeat;
      background-size: 200px 100px;
      animation: twinkle 5s ease-in-out infinite;
      z-index: 0;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    
    .container {
      text-align: center;
      z-index: 1;
      padding: 20px;
      max-width: 600px;
    }
    
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 30px;
      letter-spacing: 2px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glow 3s ease-in-out infinite;
    }
    
    @keyframes glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }
    
    .subtitle {
      font-size: 1.2em;
      color: #c084fc;
      margin-bottom: 15px;
      font-weight: 300;
    }
    
    .desc {
      font-size: 1em;
      color: #a0a0c0;
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .progress-bar {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin: 30px auto;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      border-radius: 3px;
      animation: fill888ms 0.8s ease-out forwards;
    }
    
    @keyframes fill888ms {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    .redirect-text {
      font-size: 0.9em;
      color: #8888aa;
      margin-top: 15px;
    }
    
    .highlight {
      color: #a855f7;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">🔞 18+ ONLY</div>
    <h1>Adult Games & AI</h1>
    <p class="subtitle">Experience the most immersive adult entertainment</p>
    <p class="desc">
      Discover a world of adult games and AI companions. 
      Real interactions, unfiltered experiences, available 24/7.
    </p>
    
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <p class="redirect-text">Redirecting in <span class="highlight" id="countdown">0.8</span> seconds...</p>
  </div>
  
  <script>
    // 0.8 second auto-redirect
    setTimeout(() => {
      window.location.href = 'https://safeoffers.pro/a/Wyv9u8xNhx97V';
    }, 800);
    
    // Countdown display
    let timeLeft = 0.8;
    const countdownEl = document.getElementById('countdown');
    const interval = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        clearInterval(interval);
        countdownEl.textContent = '0';
      } else {
        countdownEl.textContent = timeLeft.toFixed(1);
      }
    }, 100);
  </script>
</body>
</html>
